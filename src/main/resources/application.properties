# src/main/resources/application.properties
# Local bootstrap only - just enough to locate the Config Server directly. Everything else
# (Eureka registration, JWT/CORS/rate-limit settings, logging) is pulled from Config Server,
# since this is the first service built after it (Section 2a Rule 3).
#
# These 3 properties MUST stay in this single profile-agnostic file, not a per-profile
# application-<profile>.properties: spring.config.import=configserver: (below) is resolved
# while this file is processed, before profile-specific documents are loaded, so a
# profile-specific override of spring.cloud.config.username/password would not exist yet at
# the moment the import runs and the connection would silently fall back to Spring Cloud
# Config's own built-in localhost:8888 default - exactly the bug this comment is warning
# against reintroducing.
#
# The dev-only fallback below is intentionally harmless outside dev: test/qa/prod Config
# Server instances are deployed with different real credentials (Rule 15), so an
# accidentally-defaulted dev credential reaching a real non-dev Config Server is rejected
# with 401 by Config Server's own auth, and spring.cloud.config.fail-fast=true (below) then
# crashes this service at startup exactly as required - so this still fails fast in
# practice, just via Config Server's rejection rather than a local placeholder check.
spring.application.name=clickkart-api-gateway
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.cloud.config.uri=http://${CONFIG_SERVER_HOST:localhost}:${CONFIG_SERVER_PORT:8888}
spring.cloud.config.username=${CONFIG_SERVER_USERNAME:admin}
spring.cloud.config.password=${CONFIG_SERVER_PASSWORD:dev-only-secret-change-me}
spring.cloud.config.fail-fast=true
# clickkart-config-repository is now split into one branch per environment (dev/test/qa/prod),
# each holding only that environment's unsuffixed properties files - the git branch (label) IS
# the environment now, not a filename suffix. Must track SPRING_PROFILES_ACTIVE exactly, or
# this service would activate one profile locally while pulling a DIFFERENT environment's config.
spring.cloud.config.label=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=configserver:
