# docker/docker-compose.test.yml
services:
  api-gateway:
    environment:
      SPRING_PROFILES_ACTIVE: test
      CONFIG_SERVER_HOST: clickkart-config-server
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:?CONFIG_SERVER_USERNAME must be set for test}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?CONFIG_SERVER_PASSWORD must be set for test}
      GATEWAY_HOSTNAME: gateway-test
      GATEWAY_ADMIN_USERNAME: ${GATEWAY_ADMIN_USERNAME:?GATEWAY_ADMIN_USERNAME must be set for test}
      GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD:?GATEWAY_ADMIN_PASSWORD must be set for test}
      EUREKA_SERVER_HOST: eureka-server-test
      EUREKA_DASHBOARD_USERNAME: ${EUREKA_DASHBOARD_USERNAME:?EUREKA_DASHBOARD_USERNAME must be set for test}
      EUREKA_DASHBOARD_PASSWORD: ${EUREKA_DASHBOARD_PASSWORD:?EUREKA_DASHBOARD_PASSWORD must be set for test}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set for test}
      REDIS_HOST: redis-test
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200}
